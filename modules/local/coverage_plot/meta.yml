name: coverage_plot
description: Create a PNG coverage or depth plot from a samtools depth TSV file
keywords:
  - coverage
  - depth
  - plot
  - samtools
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - depth_file:
        type: file
        description: Samtools depth TSV file
        pattern: "*.tsv"
    - coverage_file:
        type: file
        description: Samtools coverage TSV file used to extract mapped reads per reference
        pattern: "*.tsv"
output:
  png:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.png":
          type: file
          description: Coverage or depth plot in PNG format
          pattern: "*.png"
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - "python --version | sed -e 's/Python //g'":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - "python --version | sed -e 's/Python //g'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@LilyAnderssonLee"
