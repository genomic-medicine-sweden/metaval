<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2070" height="742" viewBox="0 0 2070 742" role="img" aria-labelledby="title desc">
  <title id="title">MetaVal pipeline metro map</title>
  <desc id="desc">Metro-style overview of pathogen screening and virus verification workflows.</desc>
  <defs>
    <style>
      text { font-family:'Maven Pro',Arial,sans-serif; font-size:18.5px; font-weight:700; font-style:normal; font-stretch:normal; fill:#111 }
      .route { fill:none; stroke-width:7; stroke-linecap:square; stroke-linejoin:round }
      .green { stroke:#22ad64 }
      .orange { stroke:#ff9d38 }
      .blue { stroke:#79add8 }
      .station { fill:#fff; stroke:#222; stroke-width:1.6 }
      .interchange { fill:#fff; stroke:#222; stroke-width:1.6 }
      .flow-marker {
        stroke:#fff;
        stroke-width:4;
        paint-order:stroke fill;
        vector-effect:non-scaling-stroke;
        filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))
      }
      .file-format { fill:#fff }
      @media (prefers-reduced-motion: reduce) { .flow-marker { display:none } }
    </style>
    <g id="file-icon">
      <path d="M20 0h39l17 17v55H20z" fill="#fff" stroke="#111" stroke-width="3"/>
      <path d="M59 0v18h17" fill="none" stroke="#111" stroke-width="3"/>
      <path d="M16 8h39l17 17v55H16z" fill="#fff" stroke="#111" stroke-width="3"/>
      <path d="M55 8v18h17" fill="none" stroke="#111" stroke-width="3"/>
      <path d="M12 4h39l17 17v55H12z" fill="#fff" stroke="#111" stroke-width="3"/>
      <path d="M51 4v18h17" fill="none" stroke="#111" stroke-width="3"/>
      <path d="M51 4l17 18H51z" fill="#111"/>
      <rect x="4" y="31" width="72" height="31" rx="5" fill="#050505"/>
    </g>
  </defs>
  <rect width="2070" height="742" fill="#fff"/>
  <rect x="146" y="195" width="133" height="480" rx="20" fill="#fff" stroke="#f7931a" stroke-width="5"/>
  <rect x="146" y="18" width="133" height="326" rx="20" fill="none" stroke="#22ad64" stroke-width="5"/>
  <text class="label bold" x="212.5" y="49" text-anchor="middle">Reference</text>
  <g transform="translate(183 61)"><use href="#file-icon"/><text class="file-format" x="40" y="52" text-anchor="middle">fasta</text></g>
  <text class="label bold" x="212.5" y="225" text-anchor="middle">Reads</text>
  <g transform="translate(183 239)"><use href="#file-icon"/><text class="file-format" x="40" y="52" text-anchor="middle">fastq</text></g>
  <text class="label bold" x="212.5" y="402" text-anchor="middle"><tspan x="212.5">Taxonomic</tspan><tspan x="212.5" dy="20">classification</tspan></text>
  <g transform="translate(183 444)"><use href="#file-icon"/><text class="file-format" x="40" y="52" text-anchor="middle">tsv</text></g>
  <text class="label small" x="212.5" y="568" text-anchor="middle"><tspan class="bold" x="212.5">Classifiers:</tspan><tspan x="212.5" dy="23">Kraken2</tspan><tspan x="212.5" dy="23">DIAMOND</tspan><tspan x="212.5" dy="23">Centrifuge</tspan></text>
  <path class="route green" d="M294 140H1204C1248 140 1280 181 1280 222V349H1775"/>
  <path class="route green" d="M860 349V254C860 226 882 203 910 203H1388C1410 203 1425 219 1425 239V349"/>
  <path class="route green" d="M860 349H900C925 349 940 308 980 308S1025 349 1060 349H1100C1129 349 1138 312 1168 312S1205 349 1232 349H1775"/>
  <path class="route orange" d="M294 356H700C730 356 735 315 780 315S825 356 860 356H900C925 356 940 315 980 315S1025 356 1060 356H1775"/>
  <path class="route blue" d="M630 363H700C730 363 735 322 780 322S825 363 860 363H900C925 363 940 322 980 322S1025 363 1060 363H1775"/>
