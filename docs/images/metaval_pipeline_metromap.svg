  <path class="route blue" d="M700 363H860"/>
  <path class="route orange" d="M900 356H1060"/>
  <path class="route blue" d="M900 363H1060"/>
  <path class="route blue" d="M630 363V495"/>
  <!-- Keep the green lower alternatives visible above the neighboring routes:
       BLASTn instead of BLASTx, and direct mapping when consensus is skipped. -->
  <path class="route green" d="M860 349H1060"/>
  <path class="route green" d="M1060 349H1232"/>
  <circle class="station" cx="370" cy="356" r="10"/>
  <circle class="station" cx="500" cy="356" r="10"/>
  <rect class="interchange" x="623" y="342" width="14" height="34" rx="5"/>
  <rect class="interchange" x="773" y="303" width="14" height="35" rx="5"/>
  <rect class="interchange" x="973" y="301" width="14" height="35" rx="5"/>
  <rect class="interchange" x="973" y="340" width="14" height="35" rx="5"/>
  <circle class="station" cx="1090" cy="200" r="10"/>
  <circle class="station" cx="1168" cy="312" r="10"/>
  <rect class="interchange" x="1273" y="338" width="14" height="35" rx="5"/>
  <rect class="interchange" x="1418" y="338" width="14" height="35" rx="5"/>
  <rect class="interchange" x="1563" y="338" width="14" height="35" rx="5"/>
  <rect class="interchange" x="1698" y="338" width="14" height="35" rx="5"/>
  <g transform="translate(1790 318) scale(.8)">
    <use href="#file-icon"/>
    <text class="file-format" x="40" y="52" text-anchor="middle">html</text>
  </g>
  <text class="label side pipeline-name" x="302" y="408">FlagTaxpasta</text>
  <text class="label bold" x="500" y="297" text-anchor="middle"><tspan x="500">Extract</tspan><tspan x="500" dy="21">Viral TaxIDs</tspan></text>
  <text class="label bold" x="630" y="297" text-anchor="middle"><tspan x="630">Extract</tspan><tspan x="630" dy="21">Reads</tspan></text>
  <text class="label" x="765" y="267" text-anchor="middle"><tspan class="bold" x="765">de-novo assembly</tspan><tspan x="765" dy="20">(SPAdes, Flye)</tspan></text>
  <text class="label" x="980" y="267" text-anchor="middle"><tspan class="bold" x="980">BLASTx</tspan><tspan x="980" dy="20">(DIAMOND)</tspan></text>
  <text class="label bold" x="980" y="408" text-anchor="middle">BLASTn</text>
  <text class="label bold" x="1090" y="181" text-anchor="middle">Extract Target Reads</text>
  <text class="label" x="1168" y="267" text-anchor="middle"><tspan class="bold" x="1168">Consensus</tspan><tspan x="1168" dy="20">(SAMtools, medaka)</tspan></text>
  <text class="label" x="1280" y="408" text-anchor="middle"><tspan class="bold" x="1280">Mapping</tspan><tspan x="1280" dy="20">(Bowtie2, minimap2)</tspan></text>
  <text class="label bold" x="1425" y="408" text-anchor="middle">Coverage &amp; depth</text>
  <text class="label bold" x="1570" y="408" text-anchor="middle">IGV</text>
  <text class="label bold" x="1705" y="408" text-anchor="middle">report</text>
  <g transform="translate(590 478) scale(.72)">
    <use href="#file-icon"/>
    <text class="file-format" x="40" y="52" text-anchor="middle">txt</text>
  </g>
  <text class="label bold" x="619" y="559" text-anchor="middle">TaxID List</text>
  <path class="route green" d="M1229 577H1340"/>
  <path class="route orange" d="M1229 619H1340"/>
  <path class="route blue" d="M1229 663H1340"/>
  <text class="label bold" x="1370" y="583">Pathogens screening</text>
  <text class="label bold" x="1370" y="625">Verify identified viruses</text>
  <text class="label bold" x="1370" y="669">Verify user defined TaxIDs</text>
  <!-- This is intentionally the final visual group so every animated dot
       renders above routes, stations, labels and file icons. -->
  <g aria-label="Animated workflow direction" style="isolation:isolate">
    <!-- All colors travel at about 110 px/s. Green defines the 26-second cycle;
         orange and blue reach the report first and wait there for the restart. -->
    <!-- Green: mapping, optional consensus, BLASTn/BLASTx, target-read extraction, IGV and report. -->
    <circle class="flow-marker" r="6" fill="#22ad64" opacity="0"><animateMotion dur="26s" begin="0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.423;1" calcMode="linear" path="M294 140H1204C1248 140 1280 181 1280 222V349H1232"/><animate attributeName="opacity" dur="26s" begin="0s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;.419;.423;1"/></circle>
    <circle class="flow-marker" r="6" fill="#22ad64" opacity="0"><animateMotion dur="26s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.423;.478;1" calcMode="linear" path="M1232 349C1205 349 1198 312 1168 312S1129 349 1100 349"/><animate attributeName="opacity" dur="26s" begin="0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.419;.423;.474;.478;1"/></circle>
    <circle class="flow-marker" r="6" fill="#22ad64" opacity="0"><animateMotion dur="26s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.423;.469;1" calcMode="linear" path="M1232 349H1100"/><animate attributeName="opacity" dur="26s" begin="0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.419;.423;.465;.469;1"/></circle>
    <circle class="flow-marker" r="6" fill="#22ad64" opacity="0"><animateMotion dur="26s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.478;.492;1" calcMode="linear" path="M1100 349H1060"/><animate attributeName="opacity" dur="26s" begin="0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.474;.478;.488;.492;1"/></circle>
    <circle class="flow-marker" r="6" fill="#22ad64" opacity="0"><animateMotion dur="26s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.492;.571;1" calcMode="linear" path="M1060 349C1025 349 1020 308 980 308S925 349 900 349H860"/><animate attributeName="opacity" dur="26s" begin="0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.488;.492;.567;.571;1"/></circle>
    <circle class="flow-marker" r="6" fill="#22ad64" opacity="0"><animateMotion dur="26s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.492;.562;1" calcMode="linear" path="M1060 349H860"/><animate attributeName="opacity" dur="26s" begin="0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.488;.492;.558;.562;1"/></circle>
    <!-- Preserve the two BLAST result streams as separate markers after they rejoin. -->
    <circle class="flow-marker" r="6" fill="#22ad64" opacity="0"><animateMotion dur="26s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.571;.980;1" calcMode="linear" path="M860 349V254C860 226 882 203 910 203H1388C1410 203 1425 219 1425 239V349H1775"/><animate attributeName="opacity" dur="26s" begin="0s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;.567;.571;1"/></circle>
    <circle class="flow-marker" r="6" fill="#22ad64" opacity="0"><animateMotion dur="26s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.562;.971;1" calcMode="linear" path="M860 349V254C860 226 882 203 910 203H1388C1410 203 1425 219 1425 239V349H1775"/><animate attributeName="opacity" dur="26s" begin="0s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;.558;.562;1"/></circle>

    <!-- Orange: one marker, optional de-novo split, rejoin, BLASTn/BLASTx split. -->
    <circle class="flow-marker" r="6" fill="#ff9d38" opacity="0"><animateMotion dur="26s" begin="0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.142;1" calcMode="linear" path="M294 356H700"/><animate attributeName="opacity" dur="26s" begin="0s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;.138;.142;1"/></circle>
    <circle class="flow-marker" r="6" fill="#ff9d38" opacity="0"><animateMotion dur="26s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.142;.207;1" calcMode="linear" path="M700 356C730 356 735 315 780 315S825 356 860 356"/><animate attributeName="opacity" dur="26s" begin="0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.138;.142;.203;.207;1"/></circle>
    <circle class="flow-marker" r="6" fill="#ff9d38" opacity="0"><animateMotion dur="26s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.142;.198;1" calcMode="linear" path="M700 356H860"/><animate attributeName="opacity" dur="26s" begin="0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.138;.142;.194;.198;1"/></circle>
    <circle class="flow-marker" r="6" fill="#ff9d38" opacity="0"><animateMotion dur="26s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.207;.221;1" calcMode="linear" path="M860 356H900"/><animate attributeName="opacity" dur="26s" begin="0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.203;.207;.217;.221;1"/></circle>
    <circle class="flow-marker" r="6" fill="#ff9d38" opacity="0"><animateMotion dur="26s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.221;.286;1" calcMode="linear" path="M900 356C925 356 940 315 980 315S1025 356 1060 356"/><animate attributeName="opacity" dur="26s" begin="0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.217;.221;.282;.286;1"/></circle>
    <circle class="flow-marker" r="6" fill="#ff9d38" opacity="0"><animateMotion dur="26s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.221;.277;1" calcMode="linear" path="M900 356H1060"/><animate attributeName="opacity" dur="26s" begin="0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.217;.221;.273;.277;1"/></circle>
    <circle class="flow-marker" r="6" fill="#ff9d38" opacity="0"><animateMotion dur="26s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.286;.536;1" calcMode="linear" path="M1060 356H1775"/><animate attributeName="opacity" dur="26s" begin="0s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;.282;.286;1"/></circle>
    <circle class="flow-marker" r="6" fill="#ff9d38" opacity="0"><animateMotion dur="26s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.277;.527;1" calcMode="linear" path="M1060 356H1775"/><animate attributeName="opacity" dur="26s" begin="0s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;.273;.277;1"/></circle>

    <!-- Blue: the same sequence, beginning at the user-supplied TaxID list. -->
    <circle class="flow-marker" r="6" fill="#79add8" opacity="0"><animateMotion dur="26s" begin="0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.071;1" calcMode="linear" path="M630 495V363H700"/><animate attributeName="opacity" dur="26s" begin="0s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;.067;.071;1"/></circle>
    <circle class="flow-marker" r="6" fill="#79add8" opacity="0"><animateMotion dur="26s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.071;.136;1" calcMode="linear" path="M700 363C730 363 735 322 780 322S825 363 860 363"/><animate attributeName="opacity" dur="26s" begin="0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.067;.071;.132;.136;1"/></circle>
    <circle class="flow-marker" r="6" fill="#79add8" opacity="0"><animateMotion dur="26s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.071;.127;1" calcMode="linear" path="M700 363H860"/><animate attributeName="opacity" dur="26s" begin="0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.067;.071;.123;.127;1"/></circle>
    <circle class="flow-marker" r="6" fill="#79add8" opacity="0"><animateMotion dur="26s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.136;.150;1" calcMode="linear" path="M860 363H900"/><animate attributeName="opacity" dur="26s" begin="0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.132;.136;.146;.150;1"/></circle>
    <circle class="flow-marker" r="6" fill="#79add8" opacity="0"><animateMotion dur="26s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.150;.215;1" calcMode="linear" path="M900 363C925 363 940 322 980 322S1025 363 1060 363"/><animate attributeName="opacity" dur="26s" begin="0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.146;.150;.211;.215;1"/></circle>
    <circle class="flow-marker" r="6" fill="#79add8" opacity="0"><animateMotion dur="26s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.150;.206;1" calcMode="linear" path="M900 363H1060"/><animate attributeName="opacity" dur="26s" begin="0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.146;.150;.202;.206;1"/></circle>
    <circle class="flow-marker" r="6" fill="#79add8" opacity="0"><animateMotion dur="26s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.215;.465;1" calcMode="linear" path="M1060 363H1775"/><animate attributeName="opacity" dur="26s" begin="0s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;.211;.215;1"/></circle>
    <circle class="flow-marker" r="6" fill="#79add8" opacity="0"><animateMotion dur="26s" begin="0s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.206;.456;1" calcMode="linear" path="M1060 363H1775"/><animate attributeName="opacity" dur="26s" begin="0s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;.202;.206;1"/></circle>
