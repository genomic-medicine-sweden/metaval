# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: mapping_shortread
description: Build Bowtie2 indexes, align short reads, and optionally generate coverage, depth, and coverage plots
keywords:
  - bowtie2
  - mapping
  - short reads
  - bam
  - coverage
  - depth

components:
  - bowtie2/build
  - fastq_align_bowtie2
  - pigz/uncompress
  - samtools/faidx
  - samtools/sort
  - samtools/coverage
  - samtools/depth
  - coverage_plot

input:
  - ch_reads_reference:
      description: |
        Short reads paired with reference genomes.
        Structure: [ val(meta), path(reads), path(reference) ]
  - generate_coverage:
      description: |
        Boolean controlling whether coverage, depth, and coverage plots are generated.
        Structure: val(boolean)
output:
  - index:
      description: |
        Bowtie2 index files.
        Structure: [ val(meta), path(index) ]
  - bam:
      description: |
        Sorted BAM alignment files.
        Structure: [ val(meta), path(bam) ]
  - bai:
      description: |
        BAM index files.
        Structure: [ val(meta), path(bai) ]
  - coverage:
      description: |
        Samtools coverage tables. Empty when generate_coverage is false.
        Structure: [ val(meta), path(coverage) ]
  - depth:
      description: |
        Samtools per-position depth tables. Empty when generate_coverage is false.
        Structure: [ val(meta), path(depth) ]
  - coverage_plot:
      description: |
        Coverage plot PNG files. Empty when generate_coverage is false.
        Structure: [ val(meta), path(png) ]
  - mqc:
      description: |
        MultiQC-ready summary files.
authors:
  - "@LilyAnderssonLee"
maintainers:
  - "@LilyAnderssonLee"
