# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: taxid_bam_fasta
description: Split mapped BAM files by pathogen TaxID and generate pathogen-specific BAM, FASTA, coverage, depth, and plot outputs
keywords:
  - bam
  - fasta
  - taxid
  - pathogen
  - coverage
  - depth
  - samtools

components:
  - subset_bam
  - samtools/sort
  - samtools/index
  - samtools/idxstats
  - samtools/flagstat
  - samtools/fasta
  - samtools/coverage
  - samtools/depth
  - coverage_plot

input:
  - ch_bam:
      description: |
        Input BAM files.
        Structure: [ val(meta), path(bam) ]
  - ch_bai:
      description: |
        Input BAM index files.
        Structure: [ val(meta), path(bai) ]
  - accession2taxid:
      description: |
        Tab-delimited accession to taxid mapping file.
  - min_read_counts:
      description: |
        Minimum number of mapped reads required to retain a taxid-specific BAM.

output:
  - taxid_bam:
      description: |
        Taxid-specific BAM files passing the mapped-read threshold.
        Structure: [ val(meta), path(bam) ]
  - taxid_bai:
      description: |
        Index files for passing taxid-specific BAMs.
        Structure: [ val(meta), path(bai) ]
  - taxid_fasta:
      description: |
        FASTA files for taxids below the mapped-read threshold.
        Structure: [ val(meta), path(fasta) ]
  - taxid_bam_fail:
      description: |
        Taxid-specific BAM files below the mapped-read threshold.
        Structure: [ val(meta), path(bam) ]
  - taxid_bai_fail:
      description: |
        Index files for taxid-specific BAMs below the mapped-read threshold.
        Structure: [ val(meta), path(bai) ]
  - coverage:
      description: |
        Pathogen-specific samtools coverage tables for both threshold branches.
        Structure: [ val(meta), path(coverage) ]
  - depth:
      description: |
        Pathogen-specific per-position depth tables for both threshold branches.
        Structure: [ val(meta), path(depth) ]
  - coverage_plot:
      description: |
        Pathogen-specific coverage plot PNG files.
        Structure: [ val(meta), path(png) ]

authors:
  - "@LilyAnderssonLee"
maintainers:
  - "@LilyAnderssonLee"
